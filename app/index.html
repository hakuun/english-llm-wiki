<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>今天学什么</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --dim:#6b7280; --line:#e5e7eb;
    --blue:#1f6feb; --green:#128a4a; --greenbg:#e8f6ee; --red:#c0392b; --redbg:#fdecea;
    --amber:#9a6700; --amberbg:#fff8e1; --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  body{padding-bottom:96px}
  header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);
    padding:12px 16px calc(10px + env(safe-area-inset-top,0)) 16px;padding-top:calc(12px + env(safe-area-inset-top,0))}
  .htop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  h1{font-size:17px;margin:0;font-weight:650}
  .meta{font-size:12px;color:var(--dim)}
  .bar{height:5px;background:var(--line);border-radius:3px;margin-top:9px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--blue);width:0;transition:width .25s}
  .datebar{display:flex;gap:8px;align-items:center;margin-top:10px}
  .datebar input[type=date]{flex:1;font:15px inherit;padding:8px 10px;border:1.5px solid var(--line);
    border-radius:9px;background:#fcfcfd;color:var(--ink)}
  .mini{padding:9px 14px;border:1.5px solid var(--line);border-radius:9px;background:#fcfcfd;font-size:14px}
  main{padding:14px 14px 8px}
  .card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:14px;
    box-shadow:0 1px 2px rgba(16,24,40,.05)}
  .sect-title{font-size:15px;font-weight:650;margin:0 0 6px}
  .sect-intro{font-size:13.5px;color:var(--dim);margin:0 0 14px;white-space:pre-wrap}
  .item{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
  .item:first-of-type{border-top:0;margin-top:0;padding-top:0}
  .q{font-size:16px;margin:0 0 4px;font-weight:550}
  .hint{font-size:13px;color:var(--dim);margin:0 0 10px}
  .zh{font-size:14px;color:var(--dim)}
  input[type=text],textarea{width:100%;font:16px/1.5 inherit;padding:12px;border:1.5px solid var(--line);
    border-radius:10px;background:#fcfcfd;color:var(--ink)}
  textarea{min-height:78px;resize:vertical}
  input[type=text]:focus,textarea:focus{outline:none;border-color:var(--blue);background:#fff}
  .opts{display:flex;flex-direction:column;gap:9px;margin-top:4px}
  .opt{display:flex;gap:10px;align-items:flex-start;padding:13px 14px;border:1.5px solid var(--line);
    border-radius:11px;background:#fcfcfd;font-size:15.5px;text-align:left;cursor:pointer}
  .opt.on{border-color:var(--blue);background:#eef4ff}
  .opt .k{width:22px;height:22px;flex:0 0 22px;border-radius:50%;border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--dim);margin-top:1px}
  .opt.on .k{border-color:var(--blue);background:var(--blue);color:#fff}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .chip{padding:9px 13px;border:1.5px solid var(--line);border-radius:20px;background:#fcfcfd;font-size:14px}
  .chip.on{border-color:var(--blue);background:#eef4ff;color:var(--blue)}
  .fb{margin-top:10px;padding:11px 12px;border-radius:10px;font-size:14px;white-space:pre-wrap}
  .fb.ok{background:var(--greenbg);color:var(--green)}
  .fb.no{background:var(--redbg);color:var(--red)}
  .fb.mid{background:var(--amberbg);color:var(--amber)}
  .fb b{font-weight:650}
  audio{width:100%;margin-top:8px}
  pre.txt{background:#f3f4f6;border-radius:10px;padding:12px;font:14px/1.7 ui-monospace,Menlo,monospace;
    white-space:pre-wrap;margin:8px 0 0}
  .variant{display:flex;gap:10px;margin:6px 0 12px}
  .variant button{flex:1;padding:15px;border:1.5px solid var(--line);border-radius:12px;background:#fcfcfd;
    font-size:15px;font-weight:600}
  .variant button.on{border-color:var(--blue);background:#eef4ff;color:var(--blue)}
  footer{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
    padding:11px 14px calc(11px + env(safe-area-inset-bottom,0));display:flex;gap:10px;align-items:center}
  .score{font-size:13px;color:var(--dim);flex:1}
  button.act{flex:0 0 auto;padding:14px 20px;border:0;border-radius:12px;background:var(--blue);color:#fff;
    font-size:16px;font-weight:600}
  button.act.ghost{background:#eef1f5;color:var(--ink)}
  button.act:disabled{opacity:.45}
  .done{text-align:center;padding:22px 8px}
  .done .big{font-size:34px;font-weight:700;margin:6px 0}
  .hidden{display:none !important}
  .note{font-size:12.5px;color:var(--dim);margin-top:10px}
</style>
</head>
<body>
<header>
  <div class="htop">
    <h1 id="title">今天学什么</h1>
    <span class="meta" id="meta"></span>
  </div>
  <div class="bar"><i id="prog"></i></div>
  <div class="datebar">
    <input type="date" id="datePick">
    <button class="mini" id="btnToday">今天</button>
  </div>
</header>

<main id="main"><div class="card">正在加载今天的计划…</div></main>

<footer>
  <span class="score" id="score"></span>
  <button class="act ghost" id="btnClear">重做</button>
  <button class="act" id="btnSubmit">提交</button>
</footer>

<script>
const $ = s => document.querySelector(s);
const KEY = d => 'ew_' + d;
const norm = s => (s||'').toLowerCase().replace(/[’‘]/g,"'").replace(/[“”]/g,'"')
  .replace(/\s+/g,' ').trim().replace(/[.!?。！？,，;；]+$/,'').trim();

const todayStr = () => new Date().toLocaleDateString('sv-SE');   // 手机本地日期 = 北京日期
let bank = null, state = {date:null, answers:{}, results:{}, checks:{}, variant:null, submitted:false};
let curDate = todayStr(), hasFeedback = false;

async function boot(date){
  curDate = date;
  $('#datePick').value = date;
  $('#main').innerHTML = '<div class="card">正在加载…</div>';
  const r = await fetch(`bank/${date}.json`, {cache:'no-store'}).catch(()=>null);
  if (r && r.ok){
    bank = await r.json();
    hasFeedback = false;
    state = Object.assign({date, answers:{}, results:{}, checks:{}, variant:null, submitted:false}, load(date)||{});
    state.date = date;
    render();
    if (state.submitted) autoRefreshFeedback();
  } else {
    bank = null;
    renderMissing(date);
  }
}

function renderMissing(date){
  $('#title').textContent = '今天学什么';
  $('#meta').textContent = date;
  $('#prog').style.width = '0%'; $('#score').textContent = '';
  $('#btnSubmit').disabled = true;
  $('#main').innerHTML = `<div class="card">
    <p class="q">${date} 这天还没有内容</p>
    <p class="hint">计划由 VPS 上的 Hermes 按你的 wiki 状态生成：先读控制面板、最近的错题和词汇表，再出题。</p>
    <button class="act" id="btnGen" style="width:100%;margin-top:12px">生成这一天的计划</button>
    <p class="note" id="genmsg"></p></div>`;
  $('#btnGen').onclick = () => generate(date);
}

async function generate(date){
  const btn = $('#btnGen'), msg = $('#genmsg');
  btn.disabled = true; btn.textContent = '生成中…';
  msg.textContent = '已启动，通常 1-3 分钟。';
  try{
    const r = await fetch('generate', {method:'POST',
      headers:{'Content-Type':'application/json','X-Wiki-Token': window.__TOKEN__||''},
      body: JSON.stringify({date})});
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'server error');
    if (j.already) msg.textContent = '这一天已经在生成中了，等它跑完。';
  }catch(e){
    btn.disabled = false; btn.textContent = '再试一次';
    msg.textContent = '启动失败：' + (e.message || e);
    return;
  }
  let tries = 0;
  const timer = setInterval(async () => {
    tries++;
    const r = await fetch(`bank/${date}.json`, {cache:'no-store'}).catch(()=>null);
    if (r && r.ok){ clearInterval(timer); msg.textContent = '好了 ✓'; boot(date); return; }
    if (tries > 30){
      clearInterval(timer); btn.disabled = false; btn.textContent = '再试一次';
      msg.textContent = '等了 4 分钟还没好 —— 可能出错了。去微信里发一句「今天学什么」看它怎么说。';
    } else {
      msg.textContent = `生成中… 已等 ${tries*8} 秒`;
    }
  }, 8000);
}

function save(){ try{ localStorage.setItem(KEY(state.date), JSON.stringify(state)); }catch(e){} }
function load(date){ try{ const s=localStorage.getItem(KEY(date)); return s?JSON.parse(s):null; }catch(e){ return null; } }

function allItems(){
  const list=[];
  for (const s of bank.sections) {
    if (s.choose_one) {
      (s.variants||[]).forEach(v => v.items.forEach(it => list.push({sect:s, item:it, variant:v.id})));
    } else {
      (s.items||[]).forEach(it => list.push({sect:s, item:it}));
    }
  }
  return list;
}
function gradableItems(){
  return allItems().filter(e => {
    const it = e.item;
    if (e.sect.choose_one && state.variant !== e.variant) return false;   // 未选的分支不计
    if (it.type === 'fill') return true;
    if (it.type === 'choice') return typeof it.answer === 'number' && it.answer >= 0;  // -1 = 问卷题
    return false;
  });
}
function isWordItem(it){ return it.type==='fill' && (it.accept||[]).every(a => !a.includes(' ')); }

function gradeFill(it, val){
  const v = norm(val);
  if (!v) return null;
  const acc = (it.accept||[]).map(norm);
  if (acc.includes(v)) return true;
  if (isWordItem(it)) return false;
  return null;                       // 句子题：交给「对照参考」，不判错
}

function render(){
  const main = $('#main'); main.innerHTML='';
  $('#title').textContent = `今天学什么 · ${bank.title}`;
  $('#meta').textContent = `${bank.date} · ${bank.minutes} 分钟`;
  document.title = `${bank.date} ${bank.title}`;

  if (bank.audio) bank.audio.forEach(()=>{});
  let idx=0;
  for (const sect of bank.sections){
    idx++;
    const card = document.createElement('section');
    card.className='card';
    card.innerHTML = `<h2 class="sect-title">${idx}. ${sect.title}${sect.minutes?` <span class="meta">${sect.minutes} 分钟</span>`:''}</h2>
      ${sect.intro?`<p class="sect-intro">${esc(sect.intro)}</p>`:''}`;

    if (sect.choose_one) {
      const wrap = document.createElement('div');
      wrap.innerHTML = `<div class="variant">
          ${(sect.variants||[]).map(v=>`<button data-v="${v.id}" class="${state.variant===v.id?'on':''}">${esc(v.title)}</button>`).join('')}
        </div>`;
      wrap.querySelectorAll('button[data-v]').forEach(b => b.onclick = () => {
        state.variant = b.dataset.v; save(); render();
      });
      card.appendChild(wrap);
      const v = (sect.variants||[]).find(x=>x.id===state.variant);
      if (!v){ card.insertAdjacentHTML('beforeend', `<p class="hint">选一个（只做一个）</p>`); }
      else {
        card.insertAdjacentHTML('beforeend', `<p class="hint">${esc(v.hint||'')}</p>`);
        v.items.forEach(it => card.appendChild(renderItem(it, sect)));
      }
    } else {
      (sect.items||[]).forEach(it => card.appendChild(renderItem(it, sect)));
    }
    main.appendChild(card);
  }
  const done = document.createElement('div');
  done.className='card done';
  const g = gradableItems();
  const ok = g.filter(e => state.results[e.item.id]===true).length;
  done.innerHTML = `<div class="meta">今天到这里</div>
    <div class="big">${ok}/${g.length}</div>
    <div class="meta">客观题正确数（写句题按参考对照，不计分）</div>
    <p class="note">提交后，答案会回到 VPS 并写进你的 wiki（词汇、错题、日志）。</p>`;
  main.appendChild(done);

  const fb = document.createElement('section');
  fb.className='card'; fb.id='feedback';
  fb.innerHTML = `<h2 class="sect-title">批改结果
      <button class="act ghost" style="float:right;padding:6px 12px;font-size:13px" onclick="loadFeedback()">刷新</button></h2>
    <p class="hint" id="fbmsg">提交后，老师（在 VPS 上）会批改并写回这里。大约 1-3 分钟，点右上「刷新」。</p>`;
  main.appendChild(fb);
  loadFeedback();
  updateBar();
}

async function loadFeedback(){
  const box = $('#feedback'); if (!box) return;
  const head = `<h2 class="sect-title">批改结果
      <button class="act ghost" style="float:right;padding:6px 12px;font-size:13px" onclick="loadFeedback()">刷新</button></h2>`;
  try{
    const r = await fetch(`feedback/${bank.date}.json`, {cache:'no-store'});
    if (!r.ok) throw new Error('none');
    const f = await r.json();
    hasFeedback = true;
    const cls = v => v==='ok'?'ok':(v==='no'?'no':'mid');
    const mark = v => v==='ok'?'✓':(v==='no'?'✗':'△');
    box.innerHTML = head + `<p class="sect-intro">${esc(f.summary||'')}${f.score?`　<b>${esc(f.score)}</b>`:''}</p>
      ${(f.items||[]).map(it => `<div class="fb ${cls(it.verdict)}">${mark(it.verdict)} ${esc(it.note||'')}</div>`).join('')}
      ${f.tomorrow?`<p class="note">明天的重点：${esc(f.tomorrow)}</p>`:''}`;
  }catch(e){
    hasFeedback = false;
    box.innerHTML = head + (state.submitted
      ? `<p class="sect-intro">批改中…（老师正在读你的作答并更新 wiki，一般 1-3 分钟）</p>
         <p class="note">页面会自动重试；也可以点右上「刷新」。</p>`
      : `<p class="sect-intro">提交后，这里会出现逐题批改。</p>`);
  }
  updateBar();
}

let fbTimer = null;
function autoRefreshFeedback(){
  if (fbTimer) return;
  let n = 0;
  fbTimer = setInterval(async () => {
    n++;
    await loadFeedback();
    if (hasFeedback || n >= 15){ clearInterval(fbTimer); fbTimer = null; }
  }, 20000);
}
function esc(s){ return (s||'').replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function renderItem(it, sect){
  const box = document.createElement('div');
  box.className='item';
  const q = `<p class="q">${esc(it.prompt)}</p>${it.hint?`<p class="hint">${esc(it.hint)}</p>`:''}`;

  if (it.type==='fill'){
    box.innerHTML = q + `<input type="text" inputmode="text" autocomplete="off" autocapitalize="off"
      spellcheck="false" placeholder="在这里输入" value="${esc(state.answers[it.id]||'')}">`;
    const inp = box.querySelector('input');
    inp.oninput = () => { state.answers[it.id]=inp.value; state.results[it.id]=undefined; save(); flash(inp); };
    inp.onblur = () => { it.accept && (state.results[it.id] = gradeFill(it, inp.value)); save(); showFeedback(box, it); updateBar(); };
  }
  else if (it.type==='write'){
    box.innerHTML = q + `<textarea placeholder="用句型框写一句就行">${esc(state.answers[it.id]||'')}</textarea>`;
    const ta = box.querySelector('textarea');
    ta.oninput = () => { state.answers[it.id]=ta.value; save(); };
    ta.onblur = () => { showFeedback(box, it); };
  }
  else if (it.type==='choice'){
    box.innerHTML = q + `<div class="opts">${(it.options||[]).map((o,i)=>
      `<button class="opt ${state.answers[it.id]===i?'on':''}" data-i="${i}">
        <span class="k">${'ABCD'[i]||i+1}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
    box.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      const i = +b.dataset.i;
      state.answers[it.id]=i;
      state.results[it.id] = (it.answer>=0 ? i===it.answer : null);
      save(); render();
    });
  }
  else if (it.type==='check'){
    box.innerHTML = q + `<div class="chips">${(it.options||[]).map((o,i)=>
      `<button class="chip ${(state.checks[it.id]||[]).includes(i)?'on':''}" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
    box.querySelectorAll('.chip').forEach(b => b.onclick = () => {
      const i=+b.dataset.i; const arr = state.checks[it.id]||[];
      state.checks[it.id] = arr.includes(i) ? arr.filter(x=>x!==i) : [...arr,i];
      save(); b.classList.toggle('on');
    });
  }
  else if (it.type==='listen'){
    const a = bank.audio?.[it.audio||0] || {};
    box.innerHTML = q + `<audio controls preload="none" src="${esc(a.url||'')}"></audio>
      <p class="note">${esc(a.note||'')}</p>`;
  }
  else if (it.type==='read'){
    box.innerHTML = q + `<pre class="txt">${esc(it.body)}</pre>${it.note?`<p class="note">${esc(it.note)}</p>`:''}`;
  }
  if (state.results[it.id]!==undefined && it.type!=='choice') showFeedback(box, it);
  return box;
}

function showFeedback(box, it){
  const old = box.querySelector('.fb'); if (old) old.remove();
  const v = state.answers[it.id];
  if (v===undefined || v==='') return;
  let cls='mid', head='对照参考', body='';
  if (it.type==='choice'){
    if (it.answer>=0){ cls = v===it.answer?'ok':'no'; head = v===it.answer?'对':'不对'; }
  } else {
    const g = gradeFill(it, v);
    if (g===true){ cls='ok'; head='对'; }
    else if (g===false){ cls='no'; head='再想想'; }
    else { cls='mid'; head='对照参考'; }
  }
  if (it.sample) body += `<b>参考：</b>${esc(it.sample)}\n`;
  if (it.why) body += esc(it.why);
  box.insertAdjacentHTML('beforeend', `<div class="fb ${cls}"><b>${head}</b>${body?`\n${body}`:''}</div>`);
}
function flash(el){ el.style.borderColor = el.value.trim()? 'var(--blue)':'var(--line)'; }

function updateBar(){
  const g = gradableItems();
  const answered = g.filter(e => state.answers[e.item.id]!==undefined && state.answers[e.item.id]!=='').length;
  const ok = g.filter(e => state.results[e.item.id]===true).length;
  const btn = $('#btnSubmit');
  $('#prog').style.width = (g.length? Math.round(answered/g.length*100):0) + '%';
  $('#meta').textContent = `${bank.date} · ${bank.minutes} 分钟`
    + (hasFeedback ? ' · 已批改 ✓' : (state.submitted ? ' · 已提交 ✓' : ''));

  if (hasFeedback){
    $('#score').textContent = `今天完成 ✓　对 ${ok}/${g.length}`;
    btn.textContent = '重新提交'; btn.classList.add('ghost'); btn.disabled = false;
  } else if (state.submitted){
    $('#score').textContent = `已提交 ✓　对 ${ok}/${g.length}　批改中…`;
    btn.textContent = '重新提交'; btn.classList.add('ghost'); btn.disabled = false;
  } else {
    $('#score').textContent = g.length ? `已答 ${answered}/${g.length}　对 ${ok}` : '今天没有客观题';
    btn.textContent = '提交'; btn.classList.remove('ghost'); btn.disabled = answered===0;
  }
}

async function submit(){
  const payload = {
    date: bank.date, title: bank.title, variant: state.variant,
    answers: state.answers, results: state.results, checks: state.checks,
    score: gradableItems().filter(e=>state.results[e.item.id]===true).length,
    total: gradableItems().length,
    submittedAt: new Date().toISOString()
  };
  $('#btnSubmit').disabled = true; $('#btnSubmit').textContent = '提交中…';
  try{
    const r = await fetch('submit', {method:'POST',
      headers:{'Content-Type':'application/json', 'X-Wiki-Token': window.__TOKEN__ || ''},
      body: JSON.stringify(payload)});
    if (!r.ok) throw new Error('HTTP '+r.status);
    state.submitted = true; state.submittedAt = new Date().toISOString(); save();
    updateBar();
    alert('提交成功 ✓\n批改一般 1-3 分钟，页面会自动刷新结果。');
    document.getElementById('feedback')?.scrollIntoView({behavior:'smooth'});
    loadFeedback(); autoRefreshFeedback();
  }catch(e){
    // offline fallback: keep it locally and offer copy
    const txt = JSON.stringify(payload, null, 1);
    await navigator.clipboard?.writeText(txt).catch(()=>{});
    $('#btnSubmit').disabled = false; $('#btnSubmit').textContent = '提交失败，重试';
    alert('提交失败（'+(e.message||e)+'）。\n结果已复制到剪贴板，可以粘贴到微信发给我。');
  }
}

$('#btnSubmit').onclick = submit;
$('#btnClear').onclick = () => { if (confirm('清空今天的作答？')){ localStorage.removeItem(KEY(state.date));
  state.answers={}; state.results={}; state.checks={}; state.variant=null; render(); } };

$('#datePick').onchange = e => boot(e.target.value || todayStr());
$('#btnToday').onclick = () => boot(todayStr());
boot(todayStr());
</script>
</body>
</html>
